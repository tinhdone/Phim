<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie Hub - Liên hệ</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a class="logo" href="index.html">
            🎬 MOVIE HUB
        </a>

        <div class="nav-links">

            <a href="index.html">
                Trang chủ
            </a>

            <a href="movies.html">
                Phim
            </a>

            <a href="detail.html">
                Chi tiết
            </a>

            <a class="active" href="contact.html">
                Liên hệ
            </a>

        </div>

    </nav>

</header>


<main class="page">

    <section class="page-heading">

        <p class="tag">
            CONTACT
        </p>

        <h1>
            Liên hệ
        </h1>

        <p>
            Gửi ý kiến hoặc đề xuất phim cho Movie Hub.
        </p>

    </section>


    <section class="contact-layout">

        <div class="content-box">

            <h2>
                Thông tin
            </h2>

            <p>
                <strong>📧 Email:</strong>
                moviehub@example.com
            </p>

            <p>
                <strong>📞 Điện thoại:</strong>
                0123 456 789
            </p>

            <p>
                <strong>📍 Địa chỉ:</strong>
                Thành phố Hồ Chí Minh
            </p>

        </div>


        <form class="contact-form">

            <label>
                Họ và tên

                <input
                    type="text"
                    placeholder="Nhập họ tên">
            </label>


            <label>
                Email

                <input
                    type="email"
                    placeholder="Nhập email">
            </label>


            <label>
                Nội dung

                <textarea
                    rows="5"
                    placeholder="Nhập nội dung">
                </textarea>

            </label>


            <button
                class="btn"
                type="submit">

                Gửi liên hệ

            </button>

        </form>

    </section>

</main>

</body>
</html>
